services:
  postgres:
    image: postgres:15-alpine
    container_name: coding-platform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-coding_platform}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - ./postgres:/var/lib/postgresql/data
      - ./config/postgres.conf:/etc/postgresql/postgresql.conf
      - ./config/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    networks:
      - coding-platform-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: coding-platform-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - ./redis:/data
      - ./config/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    networks:
      - coding-platform-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    container_name: coding-platform-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    environment:
      - PORT=3000
      - GIN_MODE=release
      - DB_HOST=coding-platform-postgres
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - DB_NAME=${POSTGRES_DB:-coding_platform}
      - REDIS_HOST=coding-platform-redis
      - REDIS_PORT=6379
      - FRONTEND_URL=http://localhost:8080
      # Cap concurrent sandbox executions so a flood of submissions can't
      # multiply the per-submission memory budget beyond the container cap.
      - SANDBOX_SLOTS=${SANDBOX_SLOTS:-4}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - coding-platform-network
    # ── Container-level resource caps ─────────────────────────────────
    # Belt-and-suspenders to the per-submission rlimits inside the sandbox:
    # even if a submission escapes its limits, the container is capped so
    # the host machine is not at risk.
    #
    # mem_limit: hard memory ceiling (OOM-kills the container, not the host)
    # memswap_limit == mem_limit: disables swap (prevents thrashing)
    # pids_limit: global process cap (fork-bomb defense across all submissions)
    # cpus: fair share of host CPU (prevents CPU starvation of other services)
    #
    # Tune these to your deployment. Defaults assume a small VM.
    mem_limit: ${BACKEND_MEM_LIMIT:-2g}
    memswap_limit: ${BACKEND_MEM_LIMIT:-2g}
    pids_limit: ${BACKEND_PIDS_LIMIT:-512}
    cpus: ${BACKEND_CPUS:-2.0}
    # Defense-in-depth: drop all Linux capabilities the backend doesn't need.
    # We keep SETUID/SETGID because the sandbox drops to uid 1001 before exec,
    # and CHOWN because Alpine's adduser/chown in entrypoint may need it.
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    container_name: coding-platform-app
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
    networks:
      - coding-platform-network

  admin-frontend:
    build:
      context: ./src/admin-frontend
      dockerfile: Dockerfile
    container_name: coding-platform-admin
    restart: unless-stopped
    ports:
      - "${ADMIN_PORT:-8081}:80"
    depends_on:
      - backend
    networks:
      - coding-platform-network

  adminer:
    image: adminer:4.8.1-standalone
    container_name: coding-platform-adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8082}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: coding-platform-postgres
      ADMINER_DESIGN: dracula
      ADMINER_PLUGINS: "tables-filter json-column edit-textarea"
    volumes:
      - ./config/adminer-index.php:/var/www/html/index.php:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - coding-platform-network

networks:
  coding-platform-network:
    driver: bridge

